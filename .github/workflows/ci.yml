name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Lint
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        run: python -m ruff check .
      - name: Check formatting
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        run: python -m ruff format --check .
      - name: Build distributions
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        run: python -m build
      - name: Smoke-test CLI
        run: python -m repo_context_doctor . --json --output self-report.json

  privacy-canary:
    name: Privacy canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install project and test runner
        run: python -m pip install ".[dev]"
      - name: Run privacy and safety regressions
        run: python -m pytest -q tests/test_privacy_and_safety.py
