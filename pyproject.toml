[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "repo-context-doctor"
version = "0.1.0"
description = "Read-only evidence inventory for coding-agent context and verification paths."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jialin Cui" }]
keywords = ["coding-agents", "repository", "diagnostics", "agents-md", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.3",
  "ruff>=0.12",
]

[project.scripts]
repo-context-doctor = "repo_context_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/cuijialin8888-code/repo-context-doctor"
Issues = "https://github.com/cuijialin8888-code/repo-context-doctor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_context_doctor"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
